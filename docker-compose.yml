services:
  mysqlserver:
    image: mysql:latest
    container_name: mysqlserver
    restart: "no"
    command:
      - "mysqld"
      - "--local-infile=1"
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
    networks:
      - mybridge
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongoserver:
    image: mongo:latest
    container_name: mongoserver
    restart: "no"
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo/db:/data/db
      - ./data/mongo/config:/data/configdb
    networks:
      - mybridge
    environment:
      MONGO_MAJOR: 7.0
      MONGO_VERSION: 7.0.12
    command: mongod
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisserver:
    image: redis:latest
    container_name: redisserver
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
      - ./logs/redis:/var/log/redis
    networks:
      - mybridge
    environment:
      REDIS_VERSION: 7.2.4
      REDIS_DOWNLOAD_URL: http://download.redis.io/releases/redis-7.2.4.tar.gz
      REDIS_DOWNLOAD_SHA: 8d104c26a154b29fd67d6568b4f375212212ad41e0c2caa3d66480e78dbd3b59
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  stockhistory-app:
    build: .
    container_name: stockhistory-app
    restart: "no"
    depends_on:
      - mysqlserver
      - mongoserver
      - redisserver
    environment:
      # 建議實際值放在 .env 檔案中
      PYTHONUNBUFFERED: "1"
      APP_ENV: "${APP_ENV:-production}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_HOST: "mysqlserver"
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-stock_data}"
      MONGO_HOST: "mongoserver"
      MONGO_PORT: "27017"
      MONGO_DATABASE: "${MONGO_DATABASE:-stock_data}"
      MONGO_USERNAME: "${MONGO_USERNAME:-}"
      MONGO_PASSWORD: "${MONGO_PASSWORD:-}"
    volumes:
      - ./logs:/app/logs
    networks:
      - mybridge
    working_dir: /app
    command: python3 -m src.main_stock

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: "no"
    ports:
      - "18081:8081"
    networks:
      - mybridge
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongoserver:27017
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_SITE_SESSIONSECRET: secret
      VCAP_APP_HOST: 0.0.0.0
    depends_on:
      - mongoserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5

  flaskserver:
    image: flaskserver:v2
    container_name: flaskserver
    restart: "no"
    ports:
      - "15000:5000"
      - "15010:5010"
    volumes:
      - ./logs/flask:/FlaskServer/logs
    networks:
      - mybridge
    working_dir: /FlaskServer
    command: python runserver.py
    depends_on:
      - mysqlserver
      - redisserver
      - mongoserver
    environment:
      PYTHON_VERSION: 3.13.7
      PYTHON_SHA256: 5462f9099dfd30e238def83c71d91897d8caa5ff6ebc7a50f14d4802cdaaa79a
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 5

  golangserver:
    image: golangserver:v1
    container_name: golangserver
    restart: "no"
    ports:
      - "18080:8080"
    volumes:
      - ./logs/golang:/GolangServer/logs
    networks:
      - mybridge
    working_dir: /GolangServer
    command: ./main
    depends_on:
      - mysqlserver
      - redisserver
      - mongoserver
      - flaskserver
    environment:
      GOLANG_VERSION: 1.25.0
      GOTOOLCHAIN: local
      GOPATH: /go
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mybridge:
    external: true
