[project]
name = "stockhistory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyutils-core @ file:///D:/Python/pyutils-core",
    "pydb-core @ file:///D:/Python/pydb-core",
    "datafetcher-core @ file:///D:/Python/datafetcher-core",
    "indicator-core @ file:///D:/Python/indicator-core",
    "backtest-engine @ file:///D:/Python/backtest-engine",
    "stockpicker-core @ file:///D:/Python/stockpicker-core",
]

[tool.pytest.ini_options]
markers = [
    "integration: Integration tests that hit external services (TWSE API).",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "black",
    "isort",
    "flake8==7.1.2",
    "flake8-docstrings",
    "flake8-bugbear",
    "mypy",
    "types-requests",
    "pandas-stubs",
    "networkx",
    "freezegun==1.5.0",
    "pytest==8.2.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
]
