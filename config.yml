# Database configuration
# Set the 'type' to 'mysql', 'postgresql', or 'sqlite' to select the database.
database:
  type: mysql

  mysql:
    user: "demo"
    password: "~Demo123"
    host: "localhost"
    port: 3307
    databasename: "demo"
    # The database name will be passed from the application logic.
    # default_db_name: 'demo'

  postgresql:
    user: "your_pg_user"
    password: "your_pg_password"
    host: "localhost"
    port: 5432
    # default_db_name: 'your_pg_db'

  sqlite:
    # For SQLite, the 'path' is the relative path to the database file.
    path: "stock_data.db"

  mongodb:
    host: "localhost"
    port: 27017
    databasename: "Demo"

# Redis cache configuration
redis:
  host: "localhost"
  port: 6379
  db: 0
  default_ttl: 3600  # 1 hour
  query_cache_ttl: 1800  # 30 minutes
  data_cache_ttl: 7200  # 2 hours
  socket_timeout: 5
  socket_connect_timeout: 5
  compression_threshold: 1024

# Cloud backup configuration
# Set 'enabled' to true to enable cloud backup
cloud_backup:
  enabled: false
  provider: aws_s3 # Options: aws_s3, azure_blob

  # AWS S3 configuration
  aws_s3:
    bucket_name: "your-stockhistory-backups"
    key_prefix: "backups/"
    access_key_id: "your_aws_access_key_id"
    secret_access_key: "your_aws_secret_access_key"
    region: "us-east-1"

  # Azure Blob Storage configuration
  azure_blob:
    container_name: "stockhistory-backups"
    connection_string: "your_azure_connection_string"

# Backup settings
backup:
  retention_days: 7 # Number of days to keep local backups
  auto_compress_logs: true # Automatically compress old log files
